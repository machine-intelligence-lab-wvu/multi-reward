# B-6 (ICLR Tier 1): different model FAMILY — Llama-3.2-3B, full method.
# Protocol = the A2 Qwen3-1.7B suite (rebuttal_local48g/A2_qwen3_17b_full.yaml):
# same optimizer, prompt, mu=2, 200 steps, save every 20. Only model, chat
# template, and batch geometry (4-GPU shape) differ.
#
# GATED MODEL: accept the Meta license on HF and export HF_TOKEN before launch.
# Launch (needs the 4-GPU shape — enforced by launch.sh):
#   GPUS=4 bash open_r1_imp/scripts/rebuttal/launch.sh B6_llama32_3b_full
model_name_or_path: meta-llama/Llama-3.2-3B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: false
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem
system_prompt: 'You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \boxed{Your Answer}. Please stop generation immediately after outputing the box.'
# Llama-3.2-3B (base) ships NO chat template (only -Instruct does), so TRL's
# maybe_apply_chat_template would crash. Plain-text base-model format:
#   "{system}\n\nProblem: {problem}\n\nSolution:" (BOS added at tokenization).
# Same template must be used at eval time for the BASE-model row; checkpoints
# inherit it automatically via the saved tokenizer (utils.get_tokenizer).
chat_template: "{% if messages[0]['role'] == 'system' %}{{ messages[0]['content'] }}\n\n{% endif %}{% for message in messages %}{% if message['role'] == 'user' %}Problem: {{ message['content'] }}{% endif %}{% endfor %}{% if add_generation_prompt %}\n\nSolution:{% endif %}"
bf16: true
beta: 0.005
use_vllm: true
do_eval: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
epsilon: 0.2
temperature: 1.0
max_grad_norm: 1.0
max_completion_length: 3072
num_generations: 7
# mu=2 as in the A2 suite: with mu=1 the whole generation batch is consumed at
# unchanged weights, so log_ratio==0 and KL-Cov is EXACTLY a no-op (see the
# derivation in rebuttal_local48g/A2_qwen3_17b_full.yaml). The earlier draft of
# this file had num_iterations: 1 — that would have silently disabled KL-Cov.
num_iterations: 2
num_train_epochs: 1
# 4-GPU shape (GPU 0 vLLM + 3x ZeRO-3): 3 * 14 * 21 = 882 effective batch,
# identical to the A2 suite's 3 * 7 * 42. B6 needs the multi-GPU shape for
# 3B ZeRO-3 memory — launch.sh rejects GPUS=2 for B6_*.
per_device_train_batch_size: 14
gradient_accumulation_steps: 21
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_steps: 200
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
report_to:
- wandb
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7
push_to_hub: false
thinking: false
overwrite_output_dir: false
eval_accuracy_steps: 0
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
output_dir: ${MR_SCRATCH}/outputs/rebuttal/B6_llama32_3b_full
run_name: b6-llama32-3b-full
reward_funcs:
- cluster_voting
- boxed_format
w_cluster_format: 0.5
w_selfcert: 0.5
w_cluster: 0.5
w_format: 0.1
beta_cov: 0.02
top_k_fraction: 0.02
entropy_bonus: 0.0
min_completion_tokens: 0
