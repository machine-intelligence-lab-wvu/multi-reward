# B-6 (ICLR Tier 1, OPTIONAL 3rd arm — launch only if time remains after
# full + intuitor): Llama-3.2-3B, supervised GRPO-GT reference.
# Mirrors rebuttal_local48g/A2_qwen3_17b_grpo_gt.yaml with only model /
# chat template / batch geometry changed.
#
# GATED MODEL: accept the Meta license on HF and export HF_TOKEN before launch.
# Launch:
#   GPUS=4 bash open_r1_imp/scripts/rebuttal/launch.sh B6_llama32_3b_grpo_gt
model_name_or_path: meta-llama/Llama-3.2-3B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: false
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem
system_prompt: 'You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \boxed{Your Answer}. Please stop generation immediately after outputing the box.'
# Same base-model template as the full arm — see B6_llama32_3b_full.yaml.
chat_template: "{% if messages[0]['role'] == 'system' %}{{ messages[0]['content'] }}\n\n{% endif %}{% for message in messages %}{% if message['role'] == 'user' %}Problem: {{ message['content'] }}{% endif %}{% endfor %}{% if add_generation_prompt %}\n\nSolution:{% endif %}"
bf16: true
beta: 0.005
use_vllm: true
do_eval: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
epsilon: 0.2
temperature: 1.0
max_grad_norm: 1.0
max_completion_length: 3072
num_generations: 7
# mu=2 to MATCH the other B6 arms' update scheme (see A2 grpo_gt for the
# derivation); routes through TRL's own _compute_loss since beta_cov==0.
num_iterations: 2
num_train_epochs: 1
# 4-GPU shape: 3 * 14 * 21 = 882 effective batch (matches the other arms).
per_device_train_batch_size: 14
gradient_accumulation_steps: 21
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_steps: 200
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
report_to:
- wandb
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7
push_to_hub: false
thinking: false
overwrite_output_dir: false
eval_accuracy_steps: 0
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
output_dir: ${MR_SCRATCH}/outputs/rebuttal/B6_llama32_3b_grpo_gt
run_name: b6-llama32-3b-grpo-gt
reward_funcs:
- accuracy
reward_weights:
- 1.0
sc_batch_size: 4
