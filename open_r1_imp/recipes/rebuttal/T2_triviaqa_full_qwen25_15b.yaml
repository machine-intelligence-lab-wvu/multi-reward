# T-2 (ICLR Tier 2, preferred): label-free NON-MATH probe — TriviaQA questions,
# full method. Trains UNLABELED on rc.nocontext *questions only* (gold answers
# are never read at training time); the cluster channel reduces to
# normalized-string equivalence over boxed short answers, which the existing
# cluster_voting reward already implements. Eval-time only: EM against gold
# aliases (evaluation/tasks/triviaqa.py) on the validation split.
# Addresses "trained only on curated math" + "when do you need pure RLIF".
#
# Launch (1.5B fits the default 2-GPU shape; launch.sh forces grad_accum 42):
#   bash open_r1_imp/scripts/rebuttal/launch.sh T2_triviaqa_full_qwen25_15b
model_name_or_path: Qwen/Qwen2.5-1.5B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: false
dataset_name: mandarjoshi/trivia_qa
dataset_config: rc.nocontext
dataset_prompt_column: question
# Boxed short answer keeps the whole cluster/format machinery unchanged; the
# completion budget is small because trivia answers are short.
system_prompt: 'You are a helpful AI Assistant. Answer the question accurately and concisely. You may reason briefly first. Then give your FINAL short answer inside the box: \boxed{Your Answer}. Please stop generation immediately after outputing the box.'
bf16: true
beta: 0.005
use_vllm: true
do_eval: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
epsilon: 0.2
temperature: 1.0
max_grad_norm: 1.0
max_completion_length: 1024
num_generations: 7
# mu=2: same reasoning as the A2/B6 suites — KL-Cov is a no-op at mu=1.
num_iterations: 2
num_train_epochs: 1
# Effective batch 882 = 21 x 14 x 3 training GPUs (matches the A2/paper
# protocol). launch.sh overrides to 21 x 42 x 1 in the 2-GPU shape and
# asserts the product either way.
per_device_train_batch_size: 21
gradient_accumulation_steps: 14
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_steps: 200
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
report_to:
- wandb
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7
push_to_hub: false
thinking: false
overwrite_output_dir: false
eval_accuracy_steps: 0
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
output_dir: ${MR_SCRATCH}/outputs/rebuttal/T2_triviaqa_full_qwen25_15b
run_name: t2-triviaqa-full-qwen25-15b
reward_funcs:
- cluster_voting
- boxed_format
# SQuAD-style normalization before clustering: the math normalizer keeps
# punctuation and articles, which fragments trivia clusters
# ("PARIS." / "The Paris" vs "Paris").
cluster_answer_normalizer: trivia
w_cluster_format: 0.5
w_selfcert: 0.5
w_cluster: 0.5
w_format: 0.1
# beta_cov 0.05 = the paper's Qwen2.5-1.5B default.
beta_cov: 0.05
top_k_fraction: 0.02
entropy_bonus: 0.0
min_completion_tokens: 0
