model_name_or_path: Qwen/Qwen2.5-1.5B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: false
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem
system_prompt: 'You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \boxed{Your Answer}. Please stop generation immediately after outputing the box.'
bf16: true
beta: 0.005
use_vllm: true
do_eval: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
epsilon: 0.2
temperature: 1.0
max_grad_norm: 1.0
max_completion_length: 3072
num_generations: 7
num_iterations: 1
num_train_epochs: 1
per_device_train_batch_size: 21
gradient_accumulation_steps: 14
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_steps: 200
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
report_to:
- wandb
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7
push_to_hub: false
thinking: false
overwrite_output_dir: false
eval_accuracy_steps: 0
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
output_dir: ${MR_SCRATCH}/outputs/rebuttal/A4_rlvr_majorityvote_qwen25_15b
run_name: a4-rlvr-majorityvote-qwen25-15b
reward_funcs:
- accuracy
- cluster_voting
reward_weights:
- 1.0
- 0.5
sc_batch_size: 4
