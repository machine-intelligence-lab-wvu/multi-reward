# ════════════════════════════════════════════════════════════════
# INTUITOR — Paper reproduction on Clariden GH200 cluster
# "Learning to Reason without External Rewards" (Zhao et al., 2025)
#
# Hyperparameters from Table 7 (MATH 1.5B/3B column):
#   LR=3e-6, Batch=128, Group=7, KL(beta)=0.0005, Steps=58,
#   MaxPrompt=512, MaxCompletion=3072, Temp=0.9, Clip=0.2,
#   Cosine LR, Warmup=0.1
#
# Cluster: 1 node, GPU 0 = vLLM, GPUs 1-3 = ZeRO-3 training
# Effective batch = per_device(7) x grad_accum(6) x 3 GPUs = 126
# (paper uses 128; 126 is closest achievable with group_size=7 on 3 GPUs)
# ════════════════════════════════════════════════════════════════

# ── Model (paper uses Qwen2.5-3B base) ──
model_name_or_path: Qwen/Qwen2.5-1.5B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2

# Full fine-tuning (no LoRA) — matches paper
use_peft: false

# ── Dataset ──
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem

# ── System prompt (from paper Appendix B.1, Qwen2.5-3B variant) ──
system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box."

# ── Reward functions (logged only, zero-weighted — INTUITOR uses self-certainty) ──
reward_funcs:
  - cluster_voting
  - boxed_format
reward_weights:
  - 0.0
  - 0.0

# ── GRPO hyperparameters (Table 7) ──
bf16: true
beta: 0.005                           # KL penalty — paper's value for 1.5B/3B
use_vllm: true
do_eval: false
learning_rate: 3.0e-06                # paper: 3e-6
lr_scheduler_type: cosine             # paper: cosine
warmup_ratio: 0.1                     # paper: 0.1
temperature: 1                        # paper: 0.9 (generation temperature)
epsilon: 0.2                          # paper: clip ratio 0.2
max_completion_length: 3072           # paper: 3072
num_generations: 7                    # paper: group size 7
max_steps: 500                         # paper: 58 steps
num_iterations: 1
gradient_accumulation_steps: 14        # 21 * 14 * 3 GPUs = 126 ≈ 128
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
per_device_train_batch_size: 21        # one prompt group per forward pass

# ── Output ──
output_dir: ${MR_OUTPUT_DIR}/run2_intuitor_qwen25_15b
overwrite_output_dir: false

# ── Logging ──
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
run_name: run2_intuitor-qwen25-15b
report_to:
  - wandb

# ── Checkpointing ──
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7

# ── Hub ──
push_to_hub: false
hub_model_id: shourovj/intuitor-grpo
hub_strategy: checkpoint
hub_private_repo: true
hub_push_every_n_steps: 20

# ── INTUITOR-specific ──
thinking: false                       # paper uses Qwen2.5 (no thinking mode) so disable these by setting to 0
min_completion_tokens: 0
sc_batch_size: 4

# ── In-training eval ──
eval_accuracy_steps: 0               # eval every 10 steps to track progress
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
