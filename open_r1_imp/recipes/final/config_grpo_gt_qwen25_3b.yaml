# ════════════════════════════════════════════════════════════════
# Standard GRPO with Ground-Truth Reward (Normal Reward baseline)
# Clariden GH200 cluster — Qwen2.5-3B
#
# Follows the EXACT Intuitor paper GitHub setup for GRPO:
#   https://github.com/sunblaze-ucb/Intuitor/blob/main/open-r1-intuitor/
#     recipes/Qwen2.5-3B/grpo/config_demo.yaml
#
# Batch size matches our multi-reward runs:
#   per_device=21, grad_accum=14, 3 GPUs → effective 882
#   (fall back to per_device=12, grad_accum=24 → effective 864 if OOM)
#
# Cluster: 1 node, GPU 0 = vLLM, GPUs 1-3 = ZeRO-3 training
# ════════════════════════════════════════════════════════════════

# ── Model ──
model_name_or_path: Qwen/Qwen2.5-3B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2

# Full fine-tuning (no LoRA) — matches paper
use_peft: false

# ── Dataset (identical to paper) ──
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_config: default
dataset_prompt_column: problem

# ── System prompt (identical to paper) ──
system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box."

# ── Reward functions (paper uses accuracy with weight 1.0) ──
reward_funcs:
  - accuracy
reward_weights:
  - 1.0

# ── GRPO hyperparameters (ALL from paper's config_demo.yaml) ──
bf16: true
beta: 0.005                           # KL penalty — paper's exact value
use_vllm: true
do_eval: false
learning_rate: 3.0e-06                # paper: 3e-6
lr_scheduler_type: cosine             # paper: cosine
warmup_ratio: 0.1                     # paper: 0.1
max_completion_length: 3072           # paper: 3072
num_generations: 7                    # paper: group size 7
num_train_epochs: 1                   # paper: 1
max_steps: 500                         # paper: -1 (train full epoch)
num_iterations: 1                     # paper: 1

# ── Batch size (from our multi-reward runs, NOT paper) ──
gradient_accumulation_steps: 14       # multi-reward: 14
per_device_train_batch_size: 21       # multi-reward: 21

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_grad_norm: 1.0

# ── Output ──
output_dir: ${MR_OUTPUT_DIR}/grpo_gt_qwen25_3b
overwrite_output_dir: true

# ── Logging (matches paper) ──
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
run_name: grpo_gt-qwen25-3b
report_to:
  - wandb

# ── Checkpointing ──
save_strategy: steps
save_steps: 20
save_total_limit: 50
seed: 7

# ── Hub ──
push_to_hub: false
hub_model_id: shourovj/grpo-gt
hub_strategy: every_save
hub_private_repo: true
hub_push_every_n_steps: 20

# ── GRPO-GT specific ──
thinking: false
sc_batch_size: 4                      # for self-certainty monitoring (does not affect training)

# ── In-training eval ──
eval_accuracy_steps: 0
eval_accuracy_dataset: math500
eval_accuracy_samples: 50
