# Multi-Reward GRPO — Full Fine-Tuning Qwen2.5-1.5B + KL-Cov=0.1
# beta_cov sweep member (highest exploration in the sweep)
# 1 node Clariden GH200 120GB: GPU 0 = vLLM, GPUs 1-3 = ZeRO-3 training

# Model
model_name_or_path: Qwen/Qwen2.5-1.5B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2

use_peft: false

dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem

system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box."

reward_funcs:
  - cluster_voting
  - boxed_format

bf16: true
beta: 0.005
use_vllm: true
do_eval: false
gradient_accumulation_steps: 14
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-06
epsilon: 0.2
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_completion_length: 3072
max_steps: 500
num_generations: 7
num_train_epochs: 1
num_iterations: 1
output_dir: ${MR_OUTPUT_DIR}/multi_reward_final_klcov_0.1_qwen25_1.5b
overwrite_output_dir: false
per_device_train_batch_size: 21

push_to_hub: false
hub_model_id: shourovj/multi-reward-grpo
hub_strategy: checkpoint
hub_private_repo: true
hub_push_every_n_steps: 100

run_name: multi-reward-final-klcov(0.1)-qwen25-1.5b
report_to:
  - wandb
save_strategy: steps
save_steps: 20
save_total_limit: 25
seed: 7
warmup_ratio: 0.1
max_grad_norm: 1.0
temperature: 1.0

w_cluster_format: 0.5
w_selfcert: 0.5
w_cluster: 0.5
w_format: 0.1

beta_cov: 0.1
top_k_fraction: 0.02
entropy_bonus: 0.0
thinking: false
min_completion_tokens: 0

eval_accuracy_steps: 0
eval_accuracy_dataset: gsm8k
eval_accuracy_samples: 200


grad_corr_enabled: true
grad_corr_every_steps: 5
grad_corr_num_tensors: 4