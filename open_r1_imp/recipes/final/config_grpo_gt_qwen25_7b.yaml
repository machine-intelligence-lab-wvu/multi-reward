# ════════════════════════════════════════════════════════════════
# Standard GRPO with Ground-Truth Reward (Qwen2.5-7B)
# Matched to the 7B multi-reward klcov 0.05 run for fair comparison.
#
# Follows the Intuitor paper GRPO setup:
#   https://github.com/sunblaze-ucb/Intuitor/blob/main/open-r1-intuitor/
#     recipes/Qwen2.5-7B/grpo/config_demo.yaml
#
# Cluster: 1 node Clariden GH200 120GB
#   GPU 0   = vLLM
#   GPUs 1-3 = ZeRO-3 training
#
# Effective batch = per_device(7) × grad_accum(42) × 3 GPUs = 882
# per_device must be a multiple of num_generations (7).
# ════════════════════════════════════════════════════════════════

# ── Model ──
model_name_or_path: Qwen/Qwen2.5-7B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2

# Full fine-tuning (no LoRA) — matches paper
use_peft: false

# ── Dataset (identical to paper) ──
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_config: default
dataset_prompt_column: problem

# ── System prompt (identical to paper) ──
system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box."

# ── Reward functions (paper uses accuracy with weight 1.0) ──
reward_funcs:
  - accuracy
reward_weights:
  - 1.0

# ── GRPO hyperparameters ──
bf16: true
beta: 0.005
use_vllm: true
do_eval: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
temperature: 1.0
epsilon: 0.2
max_completion_length: 3072
num_generations: 7
num_train_epochs: 1
max_steps: 340
num_iterations: 1

# ── Batch (matches 7B multi-reward layout) ──
gradient_accumulation_steps: 42
per_device_train_batch_size: 7

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_grad_norm: 1.0

# ── Output ──
output_dir: ${MR_OUTPUT_DIR}/grpo_gt_qwen25_7b
overwrite_output_dir: false

# ── Logging ──
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
run_name: grpo_gt-qwen25-7b-rebuttal
report_to:
  - wandb

# ── Checkpointing ──
save_strategy: steps
save_steps: 20
save_total_limit: 25
seed: 7

# ── Hub ──
push_to_hub: false
hub_model_id: shourovj/grpo-gt
hub_strategy: checkpoint
hub_private_repo: true
hub_push_every_n_steps: 100

# ── GRPO-GT specific ──
thinking: false
sc_batch_size: 2                      # for self-certainty monitoring only (does not affect training)

# ── In-training eval ──
eval_accuracy_steps: 0
eval_accuracy_dataset: gsm8k
eval_accuracy_samples: 200
