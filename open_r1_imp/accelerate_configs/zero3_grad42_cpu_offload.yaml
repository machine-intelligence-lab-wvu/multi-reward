# DeepSpeed ZeRO-3 + CPU optimizer offload — grad_accum=42 variant
# Used by the 7B + 4-GPU A40 layout (3 train GPUs): per_device(7) x grad_accum(42) x 3 = eb 882.
# CPU-offload the optimizer state because A40 (46 GB) cannot hold the on-GPU AdamW state for 7B.
# Trade-off: ~3-5x slower per step than the on-GPU variant.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 42
  offload_optimizer_device: cpu
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 3
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
