# DeepSpeed ZeRO-2 — grad_accum=42 variant
# Used by the 1.5B LoRA gradcorr layout: per_device(7) x grad_accum(42) x 3 = eb 882
# (smaller per_device shrinks activation memory ~3× vs the grad_accum=14 / pd=21 layout,
#  giving the param-space gradient-correlation probe enough headroom for its
#  retain_graph=True backward passes.)
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 42
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero_stage: 2
distributed_type: DEEPSPEED
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 3
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
