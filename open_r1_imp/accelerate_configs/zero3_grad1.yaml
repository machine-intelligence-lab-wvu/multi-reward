# DeepSpeed ZeRO-3 — gradient_accumulation_steps=1, no offload.
# Used by the SMOKE=1 path of run_multi_reward_klcov_local48g.sh: keeps the real
# run's per-GPU memory profile (per_device=7, 3072-token completions, optimizer
# state on-GPU) and only shortens the accumulation loop, so an OOM here is a real
# OOM signal for the full run.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 1
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 3
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
