# DeepSpeed ZeRO-3 + CPU optimizer offload — grad_accum=126 variant
# Used by B6 (Llama-3.2-3B) in the 2-GPU shape (1 training GPU): per_device(7) x grad_accum(126) x 1 = eb 882.
# With world_size=1 ZeRO-3 has nothing to shard, so the AdamW state (~38 GB for 3B) is offloaded to CPU.
# Trade-off: ~3-5x slower per step than the on-GPU variant.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 126
  offload_optimizer_device: cpu
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
