- 0.0
beta_cov: 0.02
top_k_fraction: 0.02
loss_type: grpo
vllm_importance_sampling_correction: false
num_iterations: 1
bf16: true
beta: 0.005
use_vllm: true
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
temperature: 1.0
epsilon: 0.2
max_completion_length: 3072
num_generations: 7
max_steps: 500
gradient_accumulation_steps: 14
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
per_device_train_batch_size: 21
max_grad_norm: 1.0
output_dir: outputs/qwen2.5-1.5b_intuitor_klcov
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
run_name: qwen2.5-1.5b_intuitor_klcov
report_to:
- none
save_strategy: steps
save_steps: 20
save_total_limit: 25
seed: 7
