# qwen2.5-1.5b/multi_reward — generated from the configuration used for the paper.
method: multi_reward
model_name_or_path: Qwen/Qwen2.5-1.5B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_prompt_column: problem
system_prompt: 'You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer.
  Please enclose your final answer in the box: \boxed{Your Answer}. Please stop generation immediately after outputing the box.'
reward_funcs:
- cluster_voting
- boxed_format
w_cluster_format: 0.5
w_selfcert: 0.5
w_cluster: 0.5
w_format: 0.1
num_iterations: 1
bf16: true
beta: 0.005
use_vllm: true
gradient_accumulation_steps: 14
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-06
epsilon: 0.2
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_completion_length: 3072
max_steps: 500
num_generations: 7
num_train_epochs: 1
output_dir: outputs/qwen2.5-1.5b_multi_reward
per_device_train_batch_size: 21
run_name: qwen2.5-1.5b_multi_reward
report_to:
- none
save_strategy: steps
save_steps: 20
save_total_limit: 25
seed: 7
warmup_ratio: 0.1
max_grad_norm: 1.0
temperature: 1.0
